# CNB 云原生构建配置 - 外部数据库版本（手动触发）
# 文档: https://docs.cnb.cool
# 方案：在 CNB 构建镜像，然后部署到服务器
# 数据库：外部数据库（如 RDS）
#
# 触发方式：
#   1. 创建 deploy-* 标签手动触发部署，例如: git tag deploy-20231201 && git push --tags
#   2. 创建 v* 版本标签触发发布，例如: git tag v1.0.0 && git push --tags
#
# 使用方法：
#   将此文件重命名为 .cnb.yml 即可启用外部数据库部署模式

# ===========================================
# 手动触发部署 (通过 deploy-* 标签)
# 例如: git tag deploy-20231201 && git push origin deploy-20231201
# ===========================================
"deploy-*":
  tag:
    # 从密钥仓库导入 SSH 私钥
    - imports:
        - https://cnb.cool/tyre-flow/tyre-flow-env/-/blob/main/envs.yml
      # 使用 Docker-in-Docker 构建镜像
      services:
        - docker
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
      stages:
        # 阶段1: 构建 Docker 镜像
        - name: 🏗️ 构建 Docker 镜像
          script:
            - echo "开始构建 Docker 镜像..."
            - docker version
            - docker build -t tyre-flow-app:latest -t tyre-flow-app:${CI_COMMIT_SHORT_SHA:-latest} .
            - echo "镜像构建完成"
            - docker images | grep tyre-flow

        # 阶段2: 保存并传输镜像到服务器
        - name: 📦 保存镜像
          script:
            - echo "保存镜像为 tar 文件..."
            - docker save tyre-flow-app:latest | gzip > tyre-flow-app.tar.gz
            - ls -lh tyre-flow-app.tar.gz

        # 阶段3: 部署到服务器（外部数据库模式）
        - name: 🚀 部署到服务器
          script:
            # 安装 SSH 客户端
            - apt-get update && apt-get install -y openssh-client || apk add --no-cache openssh-client

            # 配置 SSH 密钥
            - mkdir -p ~/.ssh
            - echo "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H 8.148.203.142 >> ~/.ssh/known_hosts 2>/dev/null

            # 传输镜像到服务器
            - echo "传输镜像到服务器..."
            - scp -o StrictHostKeyChecking=no tyre-flow-app.tar.gz root@8.148.203.142:/tmp/

            # 在服务器上部署（外部数据库模式）
            - |
              ssh -o StrictHostKeyChecking=no root@8.148.203.142 << 'DEPLOY_SCRIPT'
              set -e

              echo "📂 进入项目目录..."
              DEPLOY_DIR="/root/deployment/tyre-flow"
              mkdir -p $DEPLOY_DIR
              cd $DEPLOY_DIR

              echo "📥 加载 Docker 镜像..."
              docker load < /tmp/tyre-flow-app.tar.gz
              rm -f /tmp/tyre-flow-app.tar.gz

              echo "📥 同步配置文件..."
              if [ -d ".git" ]; then
                git fetch origin
                git reset --hard origin/main
              else
                git clone -b main https://cnb.cool/tyre-flow/tyre-flow.git .
              fi

              # 检测是否是首次部署（应用容器不存在）
              FIRST_DEPLOY=false
              if ! docker ps -a --format '{{.Names}}' | grep -q "tyre-flow-app"; then
                echo "🆕 检测到首次部署..."
                FIRST_DEPLOY=true
              fi

              echo "🚢 停止旧服务..."
              docker compose --profile external-db down || true

              if [ "$FIRST_DEPLOY" = true ]; then
                echo "📊 首次部署：运行数据库迁移和初始化..."
                docker compose --profile external-db-setup run --rm migrate-external-db
              fi

              echo "🚀 启动应用服务（外部数据库模式）..."
              docker compose --profile external-db up -d --no-build

              echo "⏳ 等待服务启动..."
              sleep 10

              if [ "$FIRST_DEPLOY" = false ]; then
                echo "📊 运行数据库迁移（如有更新）..."
                docker compose --profile external-db-setup run --rm migrate-external-db || echo "迁移已完成或无更新"
              fi

              echo "🔍 检查服务状态..."
              if docker compose --profile external-db ps | grep -q "Up"; then
                echo "✅ 服务运行正常"
                docker compose --profile external-db ps
              else
                echo "❌ 服务启动失败"
                docker compose --profile external-db logs --tail=50
                exit 1
              fi

              echo "🧹 清理旧镜像..."
              docker image prune -f

              echo ""
              echo "========================================"
              echo "✅ 部署完成！（外部数据库模式）"
              echo "========================================"
              DEPLOY_SCRIPT

# ===========================================
# 其他分支 - 仅构建测试，不部署
# ===========================================
"*":
  push:
    - services:
        - docker
      stages:
        - name: 🏗️ 构建测试
          script:
            - docker build -t tyre-flow-app:test .
            - echo "✅ 构建测试通过"

# ===========================================
# 版本发布 (通过 v* 标签)
# 例如: git tag v1.0.0 && git push origin v1.0.0
# ===========================================
"v*":
  tag:
    - imports:
        - https://cnb.cool/tyre-flow/tyre-flow-env/-/blob/main/envs.yml
      services:
        - docker
      stages:
        - name: 🏗️ 构建发布版本
          script:
            - echo "构建版本 $CNB_TAG"
            - docker build -t tyre-flow-app:$CNB_TAG -t tyre-flow-app:latest .
            - docker save tyre-flow-app:latest | gzip > tyre-flow-app.tar.gz

        - name: 🚀 部署发布版本
          script:
            - apt-get update && apt-get install -y openssh-client || apk add --no-cache openssh-client
            - mkdir -p ~/.ssh
            - echo "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H 8.148.203.142 >> ~/.ssh/known_hosts 2>/dev/null
            - scp -o StrictHostKeyChecking=no tyre-flow-app.tar.gz root@8.148.203.142:/tmp/
            - |
              ssh -o StrictHostKeyChecking=no root@8.148.203.142 << 'DEPLOY'
              set -e
              cd /root/deployment/tyre-flow

              docker load < /tmp/tyre-flow-app.tar.gz
              rm -f /tmp/tyre-flow-app.tar.gz

              git fetch --tags origin
              git checkout $CNB_TAG 2>/dev/null || git checkout origin/main

              # 检测是否首次部署
              FIRST_DEPLOY=false
              if ! docker ps -a --format '{{.Names}}' | grep -q "tyre-flow-app"; then
                FIRST_DEPLOY=true
                echo "🆕 首次部署：运行数据库迁移..."
                docker compose --profile external-db-setup run --rm migrate-external-db
              fi

              docker compose --profile external-db down || true
              docker compose --profile external-db up -d --no-build

              if [ "$FIRST_DEPLOY" = false ]; then
                docker compose --profile external-db-setup run --rm migrate-external-db || echo "迁移已完成"
              fi

              echo "✅ 版本 $CNB_TAG 部署完成（外部数据库模式）"
              DEPLOY
