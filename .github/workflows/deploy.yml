name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy prod
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          echo "server_ip=8.148.203.142" >> "$GITHUB_OUTPUT"
          echo "server_user=root" >> "$GITHUB_OUTPUT"
          echo "deploy_dir=/root/deployment/tyre-flow" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          cat > ~/.ssh/deploy.pem <<'EOF'
          ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy.pem
          ssh-keygen -y -f ~/.ssh/deploy.pem > /dev/null

          ssh-keyscan -H "${{ steps.target.outputs.server_ip }}" >> ~/.ssh/known_hosts

      - name: Prepare runtime env
        shell: bash
        env:
          EXTERNAL_DB_URL: ${{ secrets.EXTERNAL_DB_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          TENCENT_LBS_KEY: ${{ secrets.TENCENT_LBS_KEY }}
          TENCENT_LBS_SK: ${{ secrets.TENCENT_LBS_SK }}
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
          APP_PORT: ${{ secrets.APP_PORT }}
          SIGNATURE_PORT: ${{ secrets.SIGNATURE_PORT }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          SECURE_COOKIES: ${{ secrets.SECURE_COOKIES }}
          LBS_PROVIDER: ${{ secrets.LBS_PROVIDER }}
          SIGNATURE_SERVICE_URL: ${{ secrets.SIGNATURE_SERVICE_URL }}
        run: |
          set -euo pipefail

          : > /tmp/tyre-flow.env

          require_value() {
            local key="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required runtime env key: ${key}"
              exit 1
            fi
          }

          write_value() {
            local key="$1"
            local value="$2"
            if [ -n "$value" ]; then
              local escaped="${value//\'/\'\\\'\'}"
              printf "%s='%s'\n" "$key" "$escaped" >> /tmp/tyre-flow.env
            fi
          }

          require_value EXTERNAL_DB_URL "$EXTERNAL_DB_URL"
          require_value JWT_SECRET "$JWT_SECRET"
          require_value NEXTAUTH_SECRET "$NEXTAUTH_SECRET"

          write_value EXTERNAL_DB_URL "$EXTERNAL_DB_URL"
          write_value JWT_SECRET "$JWT_SECRET"
          write_value NEXTAUTH_SECRET "$NEXTAUTH_SECRET"
          write_value NEXTAUTH_URL "$NEXTAUTH_URL"
          write_value SECURE_COOKIES "${SECURE_COOKIES:-false}"
          write_value APP_PORT "$APP_PORT"
          write_value SIGNATURE_PORT "$SIGNATURE_PORT"
          write_value AMAP_API_KEY "$AMAP_API_KEY"
          write_value LBS_PROVIDER "$LBS_PROVIDER"
          write_value TENCENT_LBS_KEY "$TENCENT_LBS_KEY"
          write_value TENCENT_LBS_SK "$TENCENT_LBS_SK"
          write_value SIGNATURE_SERVICE_URL "$SIGNATURE_SERVICE_URL"
          write_value ALIBABA_CLOUD_ACCESS_KEY_ID "$ALIBABA_CLOUD_ACCESS_KEY_ID"
          write_value ALIBABA_CLOUD_ACCESS_KEY_SECRET "$ALIBABA_CLOUD_ACCESS_KEY_SECRET"

      - name: Sync runtime env
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -i ~/.ssh/deploy.pem \
            -o StrictHostKeyChecking=yes \
            /tmp/tyre-flow.env \
            "${{ steps.target.outputs.server_user }}@${{ steps.target.outputs.server_ip }}:/tmp/tyre-flow.env"

          ssh \
            -i ~/.ssh/deploy.pem \
            -o StrictHostKeyChecking=yes \
            "${{ steps.target.outputs.server_user }}@${{ steps.target.outputs.server_ip }}" \
            "install -m 700 -d '${{ steps.target.outputs.deploy_dir }}' && install -m 600 /tmp/tyre-flow.env '${{ steps.target.outputs.deploy_dir }}/.env' && rm -f /tmp/tyre-flow.env"

      - name: Open registry tunnel
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy.pem \
            -o StrictHostKeyChecking=yes \
            -fN \
            -L 5000:localhost:5000 \
            "${{ steps.target.outputs.server_user }}@${{ steps.target.outputs.server_ip }}"

      - name: Build, push, and deploy
        shell: bash
        env:
          SSH_KEY: /home/runner/.ssh/deploy.pem
          REGISTRY_HOST_OVERRIDE: localhost:5000
          DEPLOY_REPO_URL: https://github.com/eyyoung/tyre-flow.git
          DEPLOY_GIT_REF: ${{ github.sha }}
          DEBIAN_MIRROR: http://deb.debian.org/debian
          DEBIAN_SECURITY_MIRROR: http://deb.debian.org/debian-security
        run: ./scripts/deploy.sh prod --yes
