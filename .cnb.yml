# CNB 云原生构建配置
# 文档: https://docs.cnb.cool
# 
# 触发规则：
#   - dev 分支推送：部署到测试环境（本地 Docker 数据库）
#   - main 分支推送（PR 合并）：部署到生产环境（外部数据库）
#   - v* 标签：版本发布部署

# ===========================================
# dev 分支推送触发测试环境部署
# 数据库：Docker 本地数据库
# ===========================================
dev:
  push:
    # 从密钥仓库导入 SSH 私钥
    - imports:
        - https://cnb.cool/tyre-flow/tyre-flow-env/-/blob/main/envs.yml
      # 使用 Docker-in-Docker 构建镜像
      services:
        - docker
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
      stages:
        # 阶段1: 构建 Docker 镜像（应用 + 迁移）
        - name: 🏗️ 构建 Docker 镜像
          script:
            - echo "开始构建 Docker 镜像..."
            - docker version
            - docker build -t tyre-flow-app:latest -t tyre-flow-app:${CI_COMMIT_SHORT_SHA:-latest} .
            - echo "构建迁移镜像..."
            - docker build -f Dockerfile.migrate -t tyre-flow-migrate:latest .
            - echo "镜像构建完成"
            - docker images | grep tyre-flow

        # 阶段2: 保存并传输镜像到服务器
        - name: 📦 保存镜像
          script:
            - echo "保存镜像为 tar 文件..."
            - docker save tyre-flow-app:latest tyre-flow-migrate:latest | gzip > tyre-flow-app.tar.gz
            - ls -lh tyre-flow-app.tar.gz

        # 阶段3: 部署到服务器
        - name: 🚀 部署到服务器
          script:
            # 安装 SSH 客户端
            - apt-get update && apt-get install -y openssh-client || apk add --no-cache openssh-client
            
            # 配置 SSH 密钥
            - mkdir -p ~/.ssh
            - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H 212.129.242.30 >> ~/.ssh/known_hosts 2>/dev/null
            
            # 传输镜像到服务器
            - echo "传输镜像到服务器..."
            - scp -o StrictHostKeyChecking=no tyre-flow-app.tar.gz root@212.129.242.30:/tmp/
            
            # 在服务器上部署
            - |
              ssh -o StrictHostKeyChecking=no root@212.129.242.30 << 'DEPLOY_SCRIPT'
              set -e
              
              echo "📂 进入项目目录..."
              DEPLOY_DIR="/root/deployment/tyre-flow"
              mkdir -p $DEPLOY_DIR
              cd $DEPLOY_DIR
              
              echo "📥 加载 Docker 镜像..."
              docker load < /tmp/tyre-flow-app.tar.gz
              rm -f /tmp/tyre-flow-app.tar.gz
              
              echo "📥 同步配置文件..."
              if [ -d ".git" ]; then
                git fetch origin
                git reset --hard origin/main
              else
                git clone -b main https://cnb.cool/tyre-flow/tyre-flow.git .
              fi
              
              # 检测是否是首次部署（检查数据库容器是否存在）
              FIRST_DEPLOY=false
              if ! docker ps -a --format '{{.Names}}' | grep -q "tyre-flow-db"; then
                echo "🆕 检测到首次部署，将初始化数据库..."
                FIRST_DEPLOY=true
              fi
              
              echo "🚢 停止旧服务..."
              docker compose down || true
              
              if [ "$FIRST_DEPLOY" = true ]; then
                echo "🗄️ 首次部署：启动数据库服务..."
                docker compose up -d db
                
                echo "⏳ 等待数据库就绪..."
                for i in {1..30}; do
                  if docker compose exec -T db pg_isready -U tyre_flow > /dev/null 2>&1; then
                    echo "✅ 数据库已就绪"
                    break
                  fi
                  echo "   等待数据库... ($i/30)"
                  sleep 2
                done
                
                echo "📊 运行数据库迁移和初始化..."
                docker compose --profile setup run --rm migrate
                
                echo "🚀 启动应用服务..."
                docker compose --profile internal-db up -d --no-build
              else
                echo "🔄 更新部署：启动所有服务..."
                docker compose --profile internal-db up -d --no-build
                
                echo "⏳ 等待服务启动..."
                sleep 10
                
                echo "📊 运行数据库迁移（如有更新）..."
                docker compose --profile setup run --rm migrate || echo "迁移已完成或无更新"
              fi
              
              echo "⏳ 等待服务完全启动..."
              sleep 5
              
              echo "🔍 检查服务状态..."
              if docker compose ps | grep -q "Up"; then
                echo "✅ 服务运行正常"
                docker compose ps
              else
                echo "❌ 服务启动失败"
                docker compose logs --tail=50
                exit 1
              fi
              
              echo "🧹 清理旧镜像..."
              docker image prune -f
              
              echo ""
              echo "========================================"
              echo "✅ 部署完成！"
              echo "========================================"
              DEPLOY_SCRIPT

# ===========================================
# main 分支推送触发生产环境部署（PR 合并时）
# 数据库：外部数据库（如 RDS）
# ===========================================
main:
  push:
    # 从密钥仓库导入 SSH 私钥
    - imports:
        - https://cnb.cool/tyre-flow/tyre-flow-env/-/blob/main/envs.yml
      # 使用 Docker-in-Docker 构建镜像
      services:
        - docker
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
      stages:
        # 阶段1: 构建 Docker 镜像（应用 + 迁移）
        - name: 🏗️ 构建 Docker 镜像
          script:
            - echo "开始构建 Docker 镜像..."
            - docker version
            - docker build -t tyre-flow-app:latest -t tyre-flow-app:${CI_COMMIT_SHORT_SHA:-latest} .
            - echo "构建迁移镜像..."
            - docker build -f Dockerfile.migrate -t tyre-flow-migrate:latest .
            - echo "镜像构建完成"
            - docker images | grep tyre-flow

        # 阶段2: 保存并传输镜像到服务器
        - name: 📦 保存镜像
          script:
            - echo "保存镜像为 tar 文件..."
            - docker save tyre-flow-app:latest tyre-flow-migrate:latest | gzip > tyre-flow-app.tar.gz
            - ls -lh tyre-flow-app.tar.gz

        # 阶段3: 部署到服务器（外部数据库模式）
        - name: 🚀 部署到生产服务器
          script:
            # 安装 SSH 客户端
            - apt-get update && apt-get install -y openssh-client || apk add --no-cache openssh-client

            # 配置 SSH 密钥
            - mkdir -p ~/.ssh
            - echo "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H 8.148.203.142 >> ~/.ssh/known_hosts 2>/dev/null

            # 传输镜像到服务器
            - echo "传输镜像到服务器..."
            - scp -o StrictHostKeyChecking=no tyre-flow-app.tar.gz root@8.148.203.142:/tmp/

            # 在服务器上部署（外部数据库模式）
            - |
              ssh -o StrictHostKeyChecking=no root@8.148.203.142 << 'DEPLOY_SCRIPT'
              set -e

              echo "📂 进入项目目录..."
              DEPLOY_DIR="/root/deployment/tyre-flow"
              mkdir -p $DEPLOY_DIR
              cd $DEPLOY_DIR

              echo "📥 加载 Docker 镜像..."
              docker load < /tmp/tyre-flow-app.tar.gz
              rm -f /tmp/tyre-flow-app.tar.gz

              echo "📥 同步配置文件..."
              if [ -d ".git" ]; then
                git fetch origin
                git reset --hard origin/main
              else
                git clone -b main https://cnb.cool/tyre-flow/tyre-flow.git .
              fi

              # 检测是否是首次部署（应用容器不存在）
              FIRST_DEPLOY=false
              if ! docker ps -a --format '{{.Names}}' | grep -q "tyre-flow-app"; then
                echo "🆕 检测到首次部署..."
                FIRST_DEPLOY=true
              fi

              echo "🚢 停止旧服务..."
              docker compose --profile external-db down || true

              if [ "$FIRST_DEPLOY" = true ]; then
                echo "📊 首次部署：运行数据库迁移和初始化..."
                docker compose --profile external-db-setup run --rm migrate-external-db
              fi

              echo "🚀 启动应用服务（外部数据库模式）..."
              docker compose --profile external-db up -d --no-build

              echo "⏳ 等待服务启动..."
              sleep 10

              if [ "$FIRST_DEPLOY" = false ]; then
                echo "📊 运行数据库迁移（如有更新）..."
                docker compose --profile external-db-setup run --rm migrate-external-db || echo "迁移已完成或无更新"
              fi

              echo "🔍 检查服务状态..."
              if docker compose --profile external-db ps | grep -q "Up"; then
                echo "✅ 服务运行正常"
                docker compose --profile external-db ps
              else
                echo "❌ 服务启动失败"
                docker compose --profile external-db logs --tail=50
                exit 1
              fi

              echo "🧹 清理旧镜像..."
              docker image prune -f

              echo ""
              echo "========================================"
              echo "✅ 生产环境部署完成！（外部数据库模式）"
              echo "========================================"
              DEPLOY_SCRIPT

# ===========================================
# 版本发布 (通过 v* 标签)
# 部署到生产环境（外部数据库模式）
# ===========================================
"v*":
  tag:
    - imports:
        - https://cnb.cool/tyre-flow/tyre-flow-env/-/blob/main/envs.yml
      services:
        - docker
      stages:
        - name: 🏗️ 构建发布版本
          script:
            - echo "构建版本 $CNB_TAG"
            - docker build -t tyre-flow-app:$CNB_TAG -t tyre-flow-app:latest .
            - docker build -f Dockerfile.migrate -t tyre-flow-migrate:latest .
            - docker save tyre-flow-app:latest tyre-flow-migrate:latest | gzip > tyre-flow-app.tar.gz

        - name: 🚀 部署发布版本到生产环境
          script:
            - apt-get update && apt-get install -y openssh-client || apk add --no-cache openssh-client
            - mkdir -p ~/.ssh
            - echo "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H 8.148.203.142 >> ~/.ssh/known_hosts 2>/dev/null
            - scp -o StrictHostKeyChecking=no tyre-flow-app.tar.gz root@8.148.203.142:/tmp/
            - |
              ssh -o StrictHostKeyChecking=no root@8.148.203.142 << 'DEPLOY'
              set -e
              cd /root/deployment/tyre-flow

              docker load < /tmp/tyre-flow-app.tar.gz
              rm -f /tmp/tyre-flow-app.tar.gz

              git fetch --tags origin
              git checkout $CNB_TAG 2>/dev/null || git checkout origin/main

              # 检测是否首次部署
              FIRST_DEPLOY=false
              if ! docker ps -a --format '{{.Names}}' | grep -q "tyre-flow-app"; then
                FIRST_DEPLOY=true
                echo "🆕 首次部署：运行数据库迁移..."
                docker compose --profile external-db-setup run --rm migrate-external-db
              fi

              docker compose --profile external-db down || true
              docker compose --profile external-db up -d --no-build

              if [ "$FIRST_DEPLOY" = false ]; then
                docker compose --profile external-db-setup run --rm migrate-external-db || echo "迁移已完成"
              fi

              echo "✅ 版本 $CNB_TAG 部署完成（生产环境）"
              DEPLOY
