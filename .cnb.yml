# CNB 云原生构建配置
# 文档: https://docs.cnb.cool
# 方案：在 CNB 构建镜像，然后部署到服务器

# ===========================================
# 主分支推送触发自动部署
# ===========================================
main:
  push:
    # 从密钥仓库导入 SSH 私钥
    - imports:
        - https://cnb.cool/tyre-flow/tyre-flow-env/-/blob/main/envs.yml
      # 使用 Docker-in-Docker 构建镜像
      services:
        - docker
      env:
        DOCKER_HOST: unix:///var/run/docker.sock
      stages:
        # 阶段1: 构建 Docker 镜像
        - name: 🏗️ 构建 Docker 镜像
          script:
            - echo "开始构建 Docker 镜像..."
            - docker version
            - docker build -t tyre-flow-app:latest -t tyre-flow-app:${CI_COMMIT_SHORT_SHA:-latest} .
            - echo "镜像构建完成"
            - docker images | grep tyre-flow

        # 阶段2: 保存并传输镜像到服务器
        - name: 📦 保存镜像
          script:
            - echo "保存镜像为 tar 文件..."
            - docker save tyre-flow-app:latest | gzip > tyre-flow-app.tar.gz
            - ls -lh tyre-flow-app.tar.gz

        # 阶段3: 部署到服务器
        - name: 🚀 部署到服务器
          script:
            # 安装 SSH 客户端
            - apt-get update && apt-get install -y openssh-client || apk add --no-cache openssh-client
            
            # 配置 SSH 密钥
            - mkdir -p ~/.ssh
            - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H 212.129.242.30 >> ~/.ssh/known_hosts 2>/dev/null
            
            # 传输镜像到服务器
            - echo "传输镜像到服务器..."
            - scp -o StrictHostKeyChecking=no tyre-flow-app.tar.gz root@212.129.242.30:/tmp/
            
            # 在服务器上部署
            - |
              ssh -o StrictHostKeyChecking=no root@212.129.242.30 << 'DEPLOY_SCRIPT'
              set -e
              
              echo "📂 进入项目目录..."
              DEPLOY_DIR="/root/deployment/tyre-flow"
              mkdir -p $DEPLOY_DIR
              cd $DEPLOY_DIR
              
              echo "📥 加载 Docker 镜像..."
              docker load < /tmp/tyre-flow-app.tar.gz
              rm -f /tmp/tyre-flow-app.tar.gz
              
              echo "📥 同步配置文件..."
              if [ -d ".git" ]; then
                git fetch origin
                git reset --hard origin/main
              else
                git clone -b main https://cnb.cool/tyre-flow/tyre-flow.git .
              fi
              
              echo "🚢 启动服务..."
              docker compose down || true
              
              # 使用预构建的镜像启动（不需要再次构建）
              docker compose up -d --no-build
              
              echo "⏳ 等待服务启动..."
              sleep 15
              
              # 运行数据库迁移
              echo "📊 运行数据库迁移..."
              docker compose --profile setup run --rm migrate || echo "迁移已完成或跳过"
              
              echo "🔍 检查服务状态..."
              if docker compose ps | grep -q "Up"; then
                echo "✅ 服务运行正常"
                docker compose ps
              else
                echo "❌ 服务启动失败"
                docker compose logs --tail=50
                exit 1
              fi
              
              echo "🧹 清理旧镜像..."
              docker image prune -f
              
              echo ""
              echo "========================================"
              echo "✅ 部署完成！"
              echo "========================================"
              DEPLOY_SCRIPT

# ===========================================
# 其他分支 - 仅构建测试，不部署
# ===========================================
"*":
  push:
    - services:
        - docker
      stages:
        - name: 🏗️ 构建测试
          script:
            - docker build -t tyre-flow-app:test .
            - echo "✅ 构建测试通过"

# ===========================================
# 手动触发部署 (通过 tag)
# ===========================================
"v*":
  tag:
    - imports:
        - https://cnb.cool/tyre-flow/tyre-flow-env/-/blob/main/envs.yml
      services:
        - docker
      stages:
        - name: 🏗️ 构建发布版本
          script:
            - echo "构建版本 $CNB_TAG"
            - docker build -t tyre-flow-app:$CNB_TAG -t tyre-flow-app:latest .
            - docker save tyre-flow-app:latest | gzip > tyre-flow-app.tar.gz

        - name: 🚀 部署发布版本
          script:
            - apt-get update && apt-get install -y openssh-client || apk add --no-cache openssh-client
            - mkdir -p ~/.ssh
            - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            - chmod 600 ~/.ssh/id_rsa
            - ssh-keyscan -H 212.129.242.30 >> ~/.ssh/known_hosts 2>/dev/null
            - scp -o StrictHostKeyChecking=no tyre-flow-app.tar.gz root@212.129.242.30:/tmp/
            - |
              ssh -o StrictHostKeyChecking=no root@212.129.242.30 << DEPLOY
              cd /root/deployment/tyre-flow
              docker load < /tmp/tyre-flow-app.tar.gz
              rm -f /tmp/tyre-flow-app.tar.gz
              git fetch --tags origin
              git checkout $CNB_TAG 2>/dev/null || git checkout origin/main
              docker compose down || true
              docker compose up -d --no-build
              echo "✅ 版本 $CNB_TAG 部署完成"
              DEPLOY
