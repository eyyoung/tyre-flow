version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: tyre-flow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tyre_flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tyre_flow_password}
      POSTGRES_DB: ${POSTGRES_DB:-tyre_flow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tyre_flow} -d ${POSTGRES_DB:-tyre_flow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    # 优先使用预构建镜像，没有时自动构建
    image: tyre-flow-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tyre-flow-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # 支持自定义 DATABASE_URL (用于 RDS 等外部数据库)
      # 如果未设置，则使用本地 Docker 数据库
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-tyre_flow}:${POSTGRES_PASSWORD:-tyre_flow_password}@db:5432/${POSTGRES_DB:-tyre_flow}?schema=public}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-nextauth-secret-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      # 高德地图 API Key（用于地理编码和路径规划）
      - AMAP_API_KEY=${AMAP_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  # Next.js Application (外部数据库模式，不依赖本地 db)
  app-external-db:
    image: tyre-flow-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tyre-flow-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=${EXTERNAL_DB_URL}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-nextauth-secret-change-in-production}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      # 高德地图 API Key（用于地理编码和路径规划）
      - AMAP_API_KEY=${AMAP_API_KEY:-}
    profiles:
      - external-db

  # Database migration and seeding (run once)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: tyre-flow-migrate
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-tyre_flow}:${POSTGRES_PASSWORD:-tyre_flow_password}@db:5432/${POSTGRES_DB:-tyre_flow}?schema=public}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - setup

  # Database migration (外部数据库模式)
  migrate-external-db:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: tyre-flow-migrate
    environment:
      - DATABASE_URL=${EXTERNAL_DB_URL}
    profiles:
      - external-db-setup

volumes:
  postgres_data:

